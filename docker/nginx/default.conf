server {
    listen 80;
    server_name _;

    access_log /var/log/fake-admin/access.log;
    error_log  /var/log/fake-admin/error.log warn;

    root /usr/share/nginx/html;

    # CSP compensates for the refresh token in localStorage: a foreign script will not run or send data out.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api/|token(/revoke)?$) {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }
}
