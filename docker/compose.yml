name: fake-admin

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ../backend:/var/www/backend:ro
      - nginx-logs:/var/log/fake-admin
    depends_on:
      - php

  php:
    build: ./php
    volumes:
      - ../backend:/var/www/backend
    env_file:
      - path: ../.env
        required: false
    environment:
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE:-fake_admin}
      DB_NAME_TEST: fake_admin_test
      DB_USER: ${MYSQL_USER:-fake_admin}
      DB_PASSWORD: ${MYSQL_PASSWORD:-fake_admin}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fake_admin}
      MYSQL_USER: ${MYSQL_USER:-fake_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fake_admin}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 20

  fluent-bit:
    image: fluent/fluent-bit:3.2
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - nginx-logs:/var/log/fake-admin:ro
    depends_on:
      - nginx

  # Started on demand (frontend change): docker compose run --rm node npm ...
  node:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /var/www/frontend
    volumes:
      - ../frontend:/var/www/frontend

volumes:
  mysql-data:
  nginx-logs:
